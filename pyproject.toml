[build-system]
requires = ["poetry-core>=2.2"]
build-backend = "poetry.core.masonry.api"

[project]
name = "docfgp-latin"
version = "1.0.0"
description = "DocFGP Latin provides the Tesseract models DocFGP uses to OCR the Latin script."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["docfgp", "ocr", "tesseract", "tessdata"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11", "mypy>=1.15"]

[tool.poetry]
packages = [{ include = "docfgp_latin", from = "src" }]
include = [{ path = "src/docfgp_latin/tessdata/**/*.traineddata", format = ["sdist", "wheel"] }]

[tool.poetry.dependencies]
python = ">=3.11,<4"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D", "C90", "N", "SIM", "RET", "C4", "PL", "FBT", "PT", "PERF"]
ignore = ["D203", "D213", "D413", "SIM905"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 5

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/docfgp_latin", "scripts"]
ignore_missing_imports = true
